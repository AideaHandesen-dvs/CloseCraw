# CloseCraw deadman — 放送(broadcast)の沈黙アラート（bifrost の Prometheus 用）
# 設置先: /etc/prometheus/rules/broadcast_alerts.yml
#   + prometheus.yml の rule_files に本ファイルを1行追加 → Prometheus reload。
# 仕組み: プローバ(durandal)が生存の証 closecraw_liveness_last_ok_seconds を60s毎に前進させる。
#   健全 or off-air の時だけ前進＝壊れ/プローバ停止で凍る。凍って閾値を超えたら発火。
# ★2026-09-15 以降、放送本体の沈黙はプローバ直結(--alert)が一次通知。本ファイルの役目は
#   「プローバ自身が止まったこと」の検知(BroadcastProberStale)だけに絞ってある。
#   alertname×OS で CloseCraw の ALERT_TO_SCRIPT が引かれる(os=linux)。未マッピングでも
#   DESIGN.md 通り一般ログ調査にフォールバック＝事故にならない。
groups:
  - name: broadcast_alerts
    rules:
      # ★BroadcastSilent(放送本体の沈黙)は 2026-09-15 に撤去した。設置先からも外してある。
      #   同じ事象を durandal のプローバ直結(drop-in alert.conf の --alert)が送っており、
      #   あちらは即時で「何が欠けたか」(legs_ok / mkv_age / OBS断)まで含む。対してこちらは
      #   90秒しきい値＋評価間隔で5分遅れるうえ、monitor 側の診断も専用の材料を持たない
      #   (ALERT_TO_SCRIPT に該当が無く linux_journal_anomaly.sh に落ちるだけ)ため、
      #   重複した無情報通知にしかならなかった。
      #   監視の空白は無い: 沈黙=プローバ直結 / プローバの死=下の BroadcastProberStale /
      #   ホスト死=HostDown。bifrost が落ちてもプローバ直結は durandal 単体で鳴る。
      #   ∴ このファイルから設置するのは BroadcastProberStale だけでよい。

      # 番犬の番犬: プローバ自身が止まった時の切り分け（60s timer が回っていない）
      - alert: BroadcastProberStale
        expr: time() - closecraw_liveness_prober_run_seconds > 150
        for: 0m
        labels:
          severity: warning
          os: linux
        annotations:
          summary: "沈黙検知プローバが停止: prober_run が {{ $value | humanizeDuration }} 前進していない"
          description: >-
            closecraw-liveness.timer(durandal・60s間隔)が回っていない疑い。
            これが出たら BroadcastSilent の原因はプローバ死＝放送本体の沈黙と切り分ける。

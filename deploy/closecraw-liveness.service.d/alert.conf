# ③ 自鳴化 drop-in — 常駐プローバを「検知だけ(3A/Prometheus)」から
#   「沈黙を見つけたら自分で Telegram を鳴らす」へ格上げする。
#
# 何を変えるか:
#   - EnvironmentFile: Telegram creds(TELEGRAM_BOT_TOKEN / TG_CLAUDE_ALLOWED_CHATS ほか)を注入。
#   - ExecStart= (空): 既定の ExecStart を一旦クリア(systemd drop-in の作法)。
#   - ExecStart=... --alert: notifier 直結を有効化。cooldown 900s でスパム抑制。
# 変えないもの: 基底 unit の Environment=LIVENESS_TEXTFILE(=.prom出力・3A経路) はそのまま併存。
#
# 適用(本人・sudo):
#   sudo install -Dm644 /home/john/closecraw-port/deploy/closecraw-liveness.service.d/alert.conf \
#        /etc/systemd/system/closecraw-liveness.service.d/alert.conf
#   sudo systemctl daemon-reload
# 取消:
#   sudo rm -r /etc/systemd/system/closecraw-liveness.service.d && sudo systemctl daemon-reload
[Service]
EnvironmentFile=/home/john/scripts/secrets.env
ExecStart=
ExecStart=/usr/bin/python3 /home/john/closecraw-port/src/liveness_prober.py --alert
